# LiveKit สำหรับ POC · โหมด --dev ใช้ key: devkey / secret
# ทดสอบข้ามเครื่องใน LAN: NODE_IP=<IP เครื่องนี้> docker compose up -d (LiveKit ต้องประกาศ IP ที่เครื่องอื่นเข้าถึงได้)
services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --dev --bind 0.0.0.0 --node-ip ${NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"     # signaling (WebSocket) + API
      - "7881:7881"     # WebRTC over TCP (fallback)
      - "7882:7882/udp" # WebRTC over UDP
